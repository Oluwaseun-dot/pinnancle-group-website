    <!-- Zero-Flash Theme Script (Synchronous execution before render) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('pinnacle-theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? false : true);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#050505' : '#f8fafc');
        } catch(e) {}
      })();
    </script>
